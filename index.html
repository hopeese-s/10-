<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Daily Routine & Study Dashboard — BME Mahidol 2026" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Study Dashboard · BME Mahidol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- bg-blobs hidden via CSS — no animation noise -->
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div id="app">

    <!-- ─── Header ─── -->
    <header class="app-header" role="banner">
      <div class="header-brand">
        <div class="brand-icon" aria-hidden="true">📅</div>
        <div class="brand-text">
          <h1>Study Dashboard</h1>
          <p>BME · Mahidol · 2026</p>
        </div>
      </div>

      <nav class="header-nav" aria-label="เมนูหลัก">
        <div class="seg-ctrl">
          <button class="nav-btn active" data-view="timeline">ตารางวัน</button>
          <button class="nav-btn" data-view="week">สัปดาห์</button>
          <button class="nav-btn" data-view="schedule">ตารางเรียน</button>
        </div>
      </nav>

      <div class="header-actions">
        <button class="nav-btn" id="cloud-sync-btn" title="Cloud Sync Settings" style="padding: 4px 10px; font-size: 11.5px;">☁️ Cloud</button>
        <span id="clock" aria-live="polite" aria-label="เวลาปัจจุบัน">00:00:00</span>
        <button class="icon-btn" id="theme-toggle" title="Dark / Light mode" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <!-- ─── Day Tabs ─── -->
    <div class="day-tabs-wrapper" id="day-tabs-wrapper">
      <div class="day-tabs" id="day-tabs" role="tablist" aria-label="เลือกวัน"></div>
    </div>

    <!-- ─── Main ─── -->
    <main class="main-content" id="main-content" role="main">

      <div id="view-timeline" class="view active" role="tabpanel"></div>
      <div id="view-week"     class="view"        role="tabpanel"></div>
      <div id="view-schedule" class="view"        role="tabpanel"></div>

    </main>

    <!-- ─── Mobile Nav ─── -->
    <nav class="mobile-nav" aria-label="เมนูล่าง">
      <button class="mob-nav-btn active" data-view="timeline">
        <span class="icon">🗓</span>
        <span class="label">วันนี้</span>
      </button>
      <button class="mob-nav-btn" data-view="week">
        <span class="icon">📊</span>
        <span class="label">สัปดาห์</span>
      </button>
      <button class="mob-nav-btn" data-view="schedule">
        <span class="icon">📚</span>
        <span class="label">วิชาเรียน</span>
      </button>
      <button class="mob-nav-btn" id="mob-theme-toggle">
        <span class="icon">🌙</span>
        <span class="label">ธีม</span>
      </button>
    </nav>

    <!-- ─── Edit Modal ─── -->
    <div class="modal-overlay" id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
      <div class="modal-box">
        <div class="modal-header">
          <span class="modal-title" id="edit-modal-title">แก้ไขกิจกรรม</span>
          <button class="modal-close" id="edit-cancel-btn" aria-label="ปิด">✕</button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-actions">
          <button class="btn btn-danger"    id="edit-delete-btn">ลบ</button>
          <button class="btn btn-secondary" id="edit-cancel-btn-footer">ยกเลิก</button>
          <button class="btn btn-primary"   id="edit-save-btn">บันทึก</button>
        </div>
      </div>
    </div>

    <!-- ─── Add Modal ─── -->
    <div class="modal-overlay" id="add-modal" role="dialog" aria-modal="true" aria-labelledby="add-modal-title">
      <div class="modal-box">
        <div class="modal-header">
          <span class="modal-title" id="add-modal-title">เพิ่มกิจกรรม</span>
          <button class="modal-close" id="add-cancel-btn" aria-label="ปิด">✕</button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="add-cancel-btn-footer">ยกเลิก</button>
          <button class="btn btn-primary"   id="add-save-btn">เพิ่ม</button>
        </div>
      </div>
    </div>

    <!-- ─── Cloud Sync Modal ─── -->
    <div class="modal-overlay" id="sync-modal" role="dialog" aria-modal="true" aria-labelledby="sync-modal-title">
      <div class="modal-box">
        <div class="modal-header">
          <span class="modal-title" id="sync-modal-title">☁️ Cloud Sync (ซิงค์ข้ามเครื่อง)</span>
          <button class="modal-close" id="sync-cancel-btn" aria-label="ปิด">✕</button>
        </div>
        <div class="modal-body">
          <p style="font-size:12.5px;color:var(--label-2);line-height:1.5;margin-bottom:14px">
            ตั้งค่า <strong>Sync Key</strong> (เช่น <code>my-bme-2026</code> หรือรหัสผ่านอะไรก็ได้ที่คุณคิดขึ้นเอง) เพื่อซิงค์ตารางและการติ๊กหนังสือข้ามเครื่อง เช่น iPad, iPhone และ Mac!
          </p>
          <div style="margin-bottom:14px" id="modal-sync-status" class="status-badge">⚪ ข้อมูลเก็บในเครื่องนี้เท่านั้น</div>
          <div class="form-group">
            <label class="form-label">Sync Key / รหัสประจำตัว</label>
            <input id="sync-key-input" class="form-input" type="text" placeholder="เช่น bme-study-pass-99" />
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="sync-disconnect-btn">ยกเลิก Sync Key</button>
          <button class="btn btn-primary" id="sync-connect-btn">เชื่อมต่อ & Sync</button>
        </div>
      </div>
    </div>

    <!-- ─── Toast ─── -->
    <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
